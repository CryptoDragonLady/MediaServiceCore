<!DOCTYPE html>
<html lang="en"><head><title></title><script>

/**
 * MOD: old webview support
 */
if (typeof Promise === "undefined") {
  (function () {
    function Promise(fn) {
      var state = "pending",
        value,
        handlers = [];

      function settle(newState, newValue) {
        if (state !== "pending")
          return;

        state = newState;
        value = newValue;
        setTimeout(function () {
          while (handlers.length)
            handle(handlers.shift());
        }, 0);
      }

      function resolve(newValue) {
        try {
          if (newValue && typeof newValue.then === "function") {
            newValue.then(resolve, reject);
            return;
          }
          settle("resolved", newValue);
        } catch (e) {
          reject(e);
        }
      }

      function reject(reason) {
        settle("rejected", reason);
      }

      function handle(handler) {
        if (state === "pending") {
          handlers.push(handler);
          return;
        }

        var callback = state === "resolved" ? handler.onResolved : handler.onRejected;
        if (typeof callback !== "function") {
          (state === "resolved" ? handler.resolve : handler.reject)(value);
          return;
        }

        try {
          handler.resolve(callback(value));
        } catch (error) {
          handler.reject(error);
        }
      }

      this.then = function (onResolved, onRejected) {
        return new Promise(function (resolveNext, rejectNext) {
          handle({
            onResolved: onResolved,
            onRejected: onRejected,
            resolve: resolveNext,
            reject: rejectNext
          });
        });
      };

      try {
        fn(resolve, reject);
      } catch (error) {
        reject(error);
      }
    }

    Promise.resolve = function (value) {
      return new Promise(function (resolve) {
        resolve(value);
      });
    };

    Promise.reject = function (reason) {
      return new Promise(function (resolve, reject) {
        reject(reason);
      });
    };

    window.Promise = Promise;
  })();
}

/**
 * MOD: old webview support
 */
if (typeof window.Symbol !== "function") {
  (function() {
    var idCounter = 0;
    var globalSymbolRegistry = {};

    var SymbolPolyfill = function Symbol(description) {
      description = description === undefined ? "" : String(description);

      var symbol = "__@@symbol_" + description + "_" + (idCounter++) + "__";

      // create a wrapper object so typeof === "symbol" can't be faked
      return symbol;
    };

    SymbolPolyfill.for = function(key) {
      key = String(key);
      if (!globalSymbolRegistry[key]) {
        globalSymbolRegistry[key] = SymbolPolyfill(key);
      }
      return globalSymbolRegistry[key];
    };

    SymbolPolyfill.keyFor = function(sym) {
      for (var key in globalSymbolRegistry) {
        if (globalSymbolRegistry[key] === sym) {
          return key;
        }
      }
      return undefined;
    };

    window.Symbol = SymbolPolyfill;
  })();
}

/**
 * Factory method to create and load a BotGuardClient instance.
 * @param options - Configuration options for the BotGuardClient.
 * @returns A promise that resolves to a loaded BotGuardClient instance.
 */
function loadBotGuard(challengeData) {
  var botguard = this;
  botguard.vm = botguard[challengeData.globalName];
  botguard.program = challengeData.program;
  botguard.vmFunctions = {};
  botguard.syncSnapshotFunction = null;

  if (!botguard.vm)
    throw new Error('[BotGuardClient]: VM not found in the global object');

  if (!botguard.vm.a)
    throw new Error('[BotGuardClient]: Could not load program');

  const vmFunctionsCallback = function (
    asyncSnapshotFunction,
    shutdownFunction,
    passEventFunction,
    checkCameraFunction
  ) {
    botguard.vmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  var noop = function () {};
  var loggerFunctions = [noop, noop, noop, noop, noop];
  var vmTelemetryCallback = function () {};

  return Promise.resolve(botguard.vm.a(
    botguard.program,
    vmFunctionsCallback,
    true,
    botguard.userInteractionElement,
    vmTelemetryCallback,
    [[], []],
    undefined,
    false,
    loggerFunctions
  )).then(function (vmLoadResult) {
    botguard.syncSnapshotFunction = vmLoadResult && vmLoadResult[0];

    // The VM installs asyncSnapshotFunction asynchronously after setup completes.
    return new Promise(function (resolve, reject) {
      var attempts = 0;
      var refreshIntervalId = setInterval(function () {
        if (botguard.vmFunctions.asyncSnapshotFunction) {
          clearInterval(refreshIntervalId);
          resolve(botguard);
        } else if (attempts >= 10000) {
          clearInterval(refreshIntervalId);
          reject(new Error("asyncSnapshotFunction is null even after 10 seconds"));
        }
        attempts += 1;
      }, 1);
    });
  });
}

/**
 * Takes a snapshot asynchronously.
 * @returns The snapshot result.
 * @example
 * ```ts
 * const result = await botguard.snapshot({
 *   contentBinding: {
 *     c: "a=6&a2=10&b=SZWDwKVIuixOp7Y4euGTgwckbJA&c=1729143849&d=1&t=7200&c1a=1&c6a=1&c6b=1&hh=HrMb5mRWTyxGJphDr0nW2Oxonh0_wl2BDqWuLHyeKLo",
 *     e: "ENGAGEMENT_TYPE_VIDEO_LIKE",
 *     encryptedVideoId: "P-vC09ZJcnM"
 *    }
 * });
 *
 * console.log(result);
 * ```
 */
function snapshot(args) {
  var botguard = this;
  return new Promise(function (resolve, reject) {
    if (!botguard.vmFunctions.asyncSnapshotFunction)
      return reject(new Error('[BotGuardClient]: Async snapshot function not found'));

    botguard.vmFunctions.asyncSnapshotFunction(function (response) { resolve(response) }, [
      args.contentBinding,
      args.signedTimestamp,
      args.webPoSignalOutput,
      args.skipPrivacyBuffer
    ]);
  });
}

function runBotGuard(challengeData) {
  const interpreterJavascript = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;

  if (interpreterJavascript) {
    new Function(interpreterJavascript)();
  } else throw new Error('Could not load VM');

  const webPoSignalOutput = [];
  return loadBotGuard({
    globalName: challengeData.globalName,
    globalObj: this,
    program: challengeData.program
  }).then(function (botguard) {
    return botguard.snapshot({ webPoSignalOutput: webPoSignalOutput })
  }).then(function (botguardResponse) {
    return { webPoSignalOutput: webPoSignalOutput, botguardResponse: botguardResponse }
  })
}

function obtainPoToken(identifier) {
  if (!(mintCallback instanceof Function))
    throw new Error('APF:Failed');

  return Promise.resolve(mintCallback(identifier)).then(function (result) {
    if (!result)
      throw new Error('YNJ:Undefined');

    if (!(result instanceof Uint8Array))
      throw new Error('ODM:Invalid');

    return result;
  });
}
</script></head><body></body></html>
